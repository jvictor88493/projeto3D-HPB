<style id="cj-tree-ui">
#conj{display:none!important}
#layers>label.sw,#layers>.sw{display:none!important}
#cjTree{display:flex;flex-direction:column}
.cjv,.cjg{display:flex;align-items:center;gap:8px;width:100%;font:inherit;font-size:13.5px;font-weight:600;text-align:left;color:var(--ink);background:none;border:0;border-top:1px solid var(--line);padding:9px 4px;cursor:pointer}
.cjv{border-top:0;padding-top:4px}
.cjg .car{width:14px;height:14px;flex:none;transition:transform .15s;color:var(--muted)}
.cjgrp.open>.cjg .car{transform:rotate(90deg)}
.cjg .nm{flex:1;min-width:0}
.cjg .ct{font-size:11.5px;font-weight:500;color:var(--muted)}
.cjv.on,.cjgrp.sel>.cjg{color:var(--accent)}
.cjgrp.sel>.cjg .nm{box-shadow:inset 0 -2px 0 var(--orange)}
@media (prefers-color-scheme: dark){.cjv.on,.cjgrp.sel>.cjg{color:#cfe0ff}}
.cjg:hover,.cjv:hover{background:var(--chip)}
.cjg:focus-visible,.cjv:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
.cjk{display:none;padding:0 0 6px 22px}
.cjgrp.open>.cjk{display:block}
.cjk .sw{padding:6px 0;font-size:12.5px;border-top:1px dashed var(--line)}
.cjk .sw:first-child{border-top:0}
</style>
<script>
(function(){
var CJ=window.__CJ,show=window.__showCJ;if(!CJ||!show)return;
var card=document.getElementById('layers');if(!card)return;
var h3=card.querySelector('h3');
if(h3){var tn=[].filter.call(h3.childNodes,function(n){return n.nodeType===3&&/Camadas/.test(n.textContent)})[0];if(tn)tn.textContent='Conjuntos'}
var orig={};[].forEach.call(document.querySelectorAll('input[type=checkbox][id^="v"]'),function(x){if(x.id!=='vAll')orig[x.id]=x});
function info(id){var x=orig[id];if(!x)return null;var lb=x.closest('label');var l=lb&&lb.querySelector('.l');if(!l)return null;var dot=l&&l.querySelector('.dot');
  var t=l?l.textContent.replace(/\(\s*[\d.]+\s*\)\s*$/,'').trim():id;return {t:t,dot:dot?dot.style.background:null}}
var names=[];[].forEach.call(document.querySelectorAll('#conjList button[data-c]'),function(b){names.push([b.getAttribute('data-c'),b.textContent.trim()])});
Object.keys(CJ).forEach(function(k){if(!names.some(function(n){return n[0]===k}))names.push([k,k])});
var used={};Object.keys(CJ).forEach(function(k){CJ[k].forEach(function(i){used[i]=1})});
var other=Object.keys(orig).filter(function(i){if(used[i]||i==='vREP')return false;var lb=orig[i].closest('label');if(!lb)return false;var st=orig[i].getAttribute('style')||'';return !/display:\s*none/.test(st)&&!(lb.closest('[style*="display:none"]'))});
var proxies={};
function sw(id){var f=info(id);if(!f)return null;
  var lb=document.createElement('label');lb.className='sw';
  lb.innerHTML='<span class="l">'+(f.dot?'<span class="dot" style="background:'+f.dot+'"></span>':'')+f.t.replace(/</g,'&lt;')+'</span>';
  var cb=document.createElement('input');cb.type='checkbox';cb.checked=orig[id].checked;lb.appendChild(cb);
  cb.addEventListener('change',function(){if(orig[id].checked!==cb.checked){orig[id].checked=cb.checked;orig[id].dispatchEvent(new Event('change',{bubbles:true}))}});
  (proxies[id]=proxies[id]||[]).push(cb);return lb}
var tree=document.createElement('div');tree.id='cjTree';
var vg=document.createElement('button');vg.type='button';vg.className='cjv';vg.innerHTML='<span class="nm">Vista geral</span>';tree.appendChild(vg);
var CAR='<svg class="car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
var groups={};
function group(k,nm,ids,act){
  var g=document.createElement('div');g.className='cjgrp';g.dataset.k=k;
  var hd=document.createElement('button');hd.type='button';hd.className='cjg';hd.setAttribute('aria-expanded','false');
  var vids=ids.filter(function(i){return info(i)});hd.innerHTML=CAR+'<span class="nm"></span><span class="ct">'+vids.length+'</span>';hd.querySelector('.nm').textContent=nm;
  var kids=document.createElement('div');kids.className='cjk';vids.forEach(function(i){var s=sw(i);if(s)kids.appendChild(s)});
  g.appendChild(hd);g.appendChild(kids);tree.appendChild(g);groups[k]=g;
  hd.addEventListener('click',function(e){
    var onCar=e.target.closest('.car');
    if(act&&!onCar){openOnly(k);sel(k);show(k)}else{var o=!g.classList.contains('open');g.classList.toggle('open',o);hd.setAttribute('aria-expanded',o)}});
}
names.forEach(function(n){if(CJ[n[0]])group(n[0],n[1],CJ[n[0]],true)});
if(other.length)group('_out','Outros itens',other,false);
function openOnly(k){Object.keys(groups).forEach(function(x){var o=x===k;groups[x].classList.toggle('open',o);groups[x].querySelector('.cjg').setAttribute('aria-expanded',o)})}
function sel(k){Object.keys(groups).forEach(function(x){groups[x].classList.toggle('sel',x===k)});vg.classList.toggle('on',k==='site')}
vg.addEventListener('click',function(){openOnly(null);sel('site');var b=document.getElementById('bSite');if(b)b.click()});
['bFront','bWalls','bAll'].forEach(function(id){var b=document.getElementById(id);if(b)b.addEventListener('click',function(){sel(null)})});
card.appendChild(tree);
function sync(){Object.keys(proxies).forEach(function(id){proxies[id].forEach(function(cb){cb.checked=orig[id].checked})})}
Object.keys(orig).forEach(function(id){orig[id].addEventListener('change',sync)});
var all=document.getElementById('vAll');if(all)all.addEventListener('change',function(){setTimeout(sync,0)});
setInterval(sync,1500);
})();
</script>
