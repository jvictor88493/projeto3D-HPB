<style id="fluxos3d-css">
#fxp{position:absolute;left:12px;bottom:12px;z-index:12;width:min(380px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(10,20,40,.25);padding:10px 12px;font-size:12.5px;cursor:default}
#fxp[hidden]{display:none}
#fxp .fxh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#fxp .fxh b{font-size:14px;margin-right:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#fxp .fxh b::after{content:'▾';font-size:11px;color:var(--muted)}
#fxp.min .fxh b::after{content:'▸'}
#fxp.min #fxChips,#fxp.min .fxopt,#fxp.min .fxleg{display:none}
#fxp.min .fxrow#fxPre{margin-bottom:0}
#fxp.min .fxh{margin-bottom:6px}
#fxp button{font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer}
#fxp button:hover{border-color:var(--accent)}
#fxp button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){#fxp button.on{color:#0e1524}}
#fxp .fxrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
#fxp .fxc{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;cursor:pointer;user-select:none;font-size:11.5px;line-height:1.3}
#fxp .fxc i{width:10px;height:10px;border-radius:50%;flex:none}
#fxp .fxc.off{opacity:.42}
#fxp .fxopt{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);margin:2px 0 6px}
#fxp .fxopt label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
#fxp input[type=range]{width:90px;accent-color:var(--orange)}
#fxp .fxleg{color:var(--muted);font-size:11.5px;line-height:1.45;border-top:1px solid var(--line);padding-top:6px}
#fxp .fxleg span.as{display:inline-block;width:22px;height:6px;vertical-align:middle;border-radius:3px;background:repeating-linear-gradient(90deg,#ff9a3c 0 5px,transparent 5px 9px);margin-right:4px}
#fxInfo{display:none;position:absolute;right:12px;top:12px;z-index:12;width:min(330px,calc(100% - 24px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 8px 28px rgba(10,20,40,.25)}
#fxInfo.show{display:block}
#fxInfo b{display:block;font-size:13.5px;margin-bottom:2px}
#fxInfo .pm{display:block;margin-top:4px;color:#d98a00;font-size:11.5px}
#fxInfo .src{display:block;margin-top:4px;color:var(--muted);font-size:11px}
#fxInfo .x{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer}
@media (max-width:820px),(max-height:500px) and (orientation:landscape){
#fxp{left:8px;right:68px;bottom:8px;width:auto;max-height:52%;padding:8px 10px}
#fxp .fxc{font-size:11px;padding:3px 8px}
#fxInfo{left:8px;right:68px;top:8px;width:auto}
}
</style>
<script id="fluxos3d">
/* Fluxos da caldeira dentro do 3D HPB Completa (água, vapor, ar, gases, sólidos, calcário/areia e cinzas).
   Trajetos em coordenadas do mapa: T (lateral), d (profundidade) e El (elevação), em metros.
   Origem: esboço "Caldeira HPB – fluxos v2" + posições reais medidas no 3D (desaerador R-023/R-039/R-028,
   silos M-154, ar de transporte M-156, exaustor R-059, chaminé M-015). Trajetos assumidos levam anéis laranja. */
(function(){
if(document.getElementById('rep'))return;
var fx=window.__fx,wrap=document.getElementById('wrap');if(!fx||!wrap)return;
var THREE=fx.THREE,scene=fx.scene,cam=fx.cam,renderer=fx.renderer;
var V3=THREE.Vector3;
function V(T,d,E){return new V3(T,fx.ezz(E*1000),3.3654-d)}

/* ---------------- camadas ---------------- */
var LAY={
 cond:{n:'Condensado e vapor ao desaerador',c:'#2ec4b6'},
 agua:{n:'Água de alimentação',c:'#3b8cff'},
 evap:{n:'Água → vapor (evaporação)',c:'#7fd0ff'},
 vapor:{n:'Vapor',c:'#ff5c7a'},
 purga:{n:'Purga',c:'#a78bfa'},
 arP:{n:'Ar primário',c:'#22c4e8'},
 arS:{n:'Ar secundário, transporte e selagem',c:'#2fbf6e'},
 gas:{n:'Gases de combustão',c:'#ff9a3c'},
 sol:{n:'Sólidos e carvão',c:'#d9b25c'},
 adit:{n:'Calcário e areia',c:'#c9bfa3'},
 cinza:{n:'Cinzas → silo',c:'#9c9488'}
};
var PRE={all:Object.keys(LAY),wv:['cond','agua','evap','vapor','purga'],ag:['arP','arS','gas'],bed:['arP','sol','adit','cinza']};
var on={};Object.keys(LAY).forEach(function(k){on[k]=true});

/* ---------------- informações (clique num tubo) ---------------- */
var INFO={
 desc:{n:'Descidas (downcomers)',t:'Água do tubulão desce sem aquecer até o coletor inferior da parede frontal (El. 17,03 m). A diferença de peso entre essa água e a mistura que sobe nas paredes faz o circuito girar (circulação natural). 14 descidas 6″ no tubulão; aqui aparecem 4.',s:'M-006 (bocais)',p:'Traçado das descidas não está no 3D.'},
 frente:{n:'Parede d’água frontal',t:'A água entra por baixo, recebe o calor da fornalha e começa a ferver: as bolhas crescem e a mistura água + vapor sobe até o tubulão. Aqui aparecem 4 dos tubos (passo real 102 mm).',s:'M-105 / M-086'},
 tras:{n:'Piso e parede traseira',t:'Os 126 tubos do piso (onde ficam os bubble caps) e a parede traseira também são evaporadores: a água ferve e sobe, passando pelos U-beams, até o tubulão.',s:'Piso / M-087 / M-116',p:'Ligação entre piso, parede traseira e U-beams simplificada.'},
 lat:{n:'Paredes laterais',t:'As paredes laterais (48 tubos no piso, painéis M-080/081) sobem até os coletores laterais superiores (El. 49,75 m), ligados ao tubulão pelos tubos Ø114,3 da M-059.',s:'M-080 / M-081 / M-059',p:'Alimentação dos coletores inferiores não lida.'},
 div:{n:'Divisórias',t:'5 painéis de 30 tubos Ø76,2 em T 0, ±2,346 e ±4,488 m, entre El. 16,37 e 49,75 m. Aqui tratadas como evaporador, subindo para o tubulão.',s:'D1-D5057-M-079',p:'Papel no circuito (evaporador × superaquecedor) ainda precisa ser confirmado.'},
 cole:{n:'Coletor inferior frontal',t:'Coletor Ø219,1 em El. 17,03 m que recebe a água das descidas e distribui para a parede frontal e o piso.',s:'M-105'},
 aguaA:{n:'Água de alimentação',t:'Sai do desaerador (bocal G 16″), passa pelas bombas, entra no economizador pelo coletor inferior A (El. 22,16 m), sobe pelas serpentinas em contracorrente com os gases, sai pelo coletor B (El. 33,27 m) ainda líquida e vai para o tubulão.',s:'R-023 (bocais) / M-010',p:'Bombas não montadas no 3D; rota até o economizador e do economizador ao tubulão assumidas.'},
 eco:{n:'Economizador',t:'176 serpentinas com 74 trechos a 102 mm. A água só esquenta, sem ferver. Aqui aparecem 3 serpentinas representativas.',s:'D1-D5057-M-010'},
 spray:{n:'Água de spray do atemperador',t:'Um pouco de água é injetada no vapor entre o primário (via wingwalls) e o secundário para controlar a temperatura final.',s:'M-097 item 11',p:'Origem da água de spray não lida: aqui sai da linha de alimentação.'},
 sat:{n:'Vapor saturado → superaquecedor primário',t:'O vapor que sai pelos secadores do tubulão (16 saídas 4″) vai ao coletor de entrada do primário (Ø273, d 13,68).',s:'M-006 / M-007 / M-059',p:'No 3D real o vapor passa pelos tubos do teto (penthouse); aqui a rota está simplificada.'},
 sp:{n:'Superaquecedor primário',t:'124 serpentinas Ø50,8 com 20 pernas; entrada no coletor Ø273 e saída no Ø355,6. Só passa vapor, que continua esquentando. Aqui aparecem 3 serpentinas.',s:'D1-D5057-M-007'},
 ww:{n:'Primário → wingwalls → atemperador → secundário',t:'O vapor que sai do primário passa pelos wingwalls (8 painéis na frente da fornalha) e pela linha Ø406,4 com o atemperador até o coletor de entrada do secundário.',s:'M-097 itens 5 e 11 / M-060',p:'Itens 5, 10 e 11 da M-097 lidos mas não montados: rota assumida.'},
 ss:{n:'Superaquecedor secundário',t:'124 serpentinas Ø50,8 com 20 pernas; entrada no coletor Ø355,6 e saída no Ø406,4. Aqui aparecem 3 serpentinas.',s:'D1-D5057-M-008'},
 main:{n:'Vapor principal → turbina',t:'Sai do coletor de saída do secundário (Ø406,4) para a turbina.',s:'M-008 / M-097',p:'Traçado até a turbina ilustrativo.'},
 cond:{n:'Condensado',t:'Volta da usina e entra no pré-desaerador pelo bocal T 8″ (lado +T, El. 33,02 m).',s:'R-023',p:'Origem não lida.'},
 vaq:{n:'Vapor de aquecimento',t:'Entra no pré-desaerador pelo bocal R 20″ (lado −T): aquece a água e arrasta o oxigênio dissolvido, que sai pelos respiros.',s:'R-023',p:'Origem (extração da turbina / vapor auxiliar) não lida.'},
 dea:{n:'Desaerador',t:'Tanque pulmão Ø3.832 × 13.000 (121 m³ úteis, 340 m³/h, projeto 3,2 kgf/cm² / 150 °C) com o pré-desaerador Ø2.438 em cima. A água cai do pré-desaerador para o tanque e sai pelo bocal G 16″.',s:'D1-D5057-R-023 / R-039 / R-028'},
 bomba:{n:'Bomba de água de alimentação',t:'Puxa a água do desaerador e empurra para o economizador. A R-023 tem bocais H 6″ de recirculação das bombas.',s:'R-023 (bocais)',p:'Bomba não montada no 3D: posição e forma ilustrativas.'},
 drum:{n:'Tubulão',t:'Ø1.676 interno, 15 m entre tangentes, eixo em El. 52,62 m. Recebe a água do economizador e a mistura das paredes; separa vapor e água. O azul é a água até o nível normal.',s:'D1-D5057-M-006',p:'Nível ilustrativo; internos (separadores, secadores) não modelados.'},
 purga:{n:'Purga contínua',t:'Tira um pouco da água do tubulão para limitar os sólidos dissolvidos. No tanque de flash parte vira vapor e o resto vai para o dreno.',s:'—',p:'Tubulação, tanque e destino assumidos.'},
 tq:{n:'Tanque de purga (flash)',t:'Recebe a purga contínua do tubulão.',s:'—',p:'Equipamento e posição assumidos.'},
 atem:{n:'Atemperador',t:'Na linha Ø406,4 entre o primário (via wingwalls) e o secundário.',s:'M-097 item 11',p:'Posição ao longo da linha assumida.'},
 arP:{n:'Ar primário',t:'Entra na câmara sob o piso (M-135/136/137) e sobe pelo furo central de cada bubble cap, saindo pelos 16 (ou 9) furos Ø5 inclinados 25° para baixo: é o ar que mantém o leito fluidizado.',s:'M-135/136/137 / M-014 a 017',p:'Duto até o ventilador (M-140) sem medidas: entrada ilustrativa.'},
 arS:{n:'Ar secundário',t:'Entra pela parede traseira: 18 aberturas em El. 22,53 m e 12 em El. 21,83 m, acima do leito.',s:'M-087',p:'Caixa/duto atrás da parede traseira assumido.'},
 arT:{n:'Ar de transporte e selagem',t:'Sai do duto de ar secundário (Ø508, El. 22,35 m), sobe em T +9,13 / d −4,556 (medidor FE-057D-078 e registro FV-057D-078) e se divide em 3 coletores: El. 30,70 (selagem dos alimentadores, El. 28,60), El. 26,95 (topo das bicas) e El. 20,25 (descidas a 65° na zona das bocas).',s:'M-156 (3D v19/v20)',p:'Ligação do riser com os coletores de El. 26,95 e 20,25 assumida.'},
 gas:{n:'Gases de combustão',t:'Sobem pela fornalha, passam pelos U-beams, pelo secundário e pelo primário, descem pelo duto M-074 até o multiciclone, seguem pelo M-072, descem pelo economizador, vão ao filtro de mangas (M-076), saem pelo M-077 para o exaustor (rotor Ø2.900, motor 2.000 kW) e pelo M-078 para a chaminé.',s:'M-074 / M-009 / M-072 / M-010 / M-076 / R-092 / M-077 / R-059 / M-078 / M-015',p:'Fluxo interno do filtro ilustrativo.'},
 leito:{n:'Leito fluidizado',t:'Areia, cinza e carvão borbulhando sobre o piso: os sólidos sobem com o ar e voltam para o leito.',s:'—'},
 reinj:{n:'Reinjeção de cinzas do multiciclone',t:'Os 4 funis do multiciclone (El. 27,54 m) descarregam e as cinzas voltam ao leito pela parede traseira (4 reinjeções em El. 18,71 m).',s:'M-009 / M-087 / M-154',p:'Tubulação não montada no 3D: traçado ilustrativo.'},
 carvao:{n:'Carvão',t:'Dos alimentadores gravimétricos (El. ~28,6 m) desce pelas 6 bicas Ø457 a 25° até as bocas na parede frontal (El. 18,89 m).',s:'M-105 / M-156',p:'Alimentadores e silo de carvão não montados.'},
 calc:{n:'Calcário',t:'Do silo Ø3.000 (cone até El. 33,26 m) para a fornalha, onde reage com o enxofre no leito.',s:'D0-D5057-M-154',p:'Rota até a fornalha assumida (junto com o carvão).'},
 areia:{n:'Areia',t:'Do silo Ø2.628 (cone até El. 36,10 m) para repor o material inerte do leito.',s:'D0-D5057-M-154',p:'Rota até a fornalha assumida.'},
 cinza:{n:'Cinzas → silo de cinzas',t:'Cinzas pesadas (dreno do leito) e leves (bica do economizador e 4 tremonhas do filtro) vão por transporte pneumático até o silo Ø5.000 (El. 32,02 a 50,63 m).',s:'D0-D5057-M-154 (equipamentos)',p:'Roscas de extração e transporte pneumático não montados: rota ilustrativa.'},
 queda:{n:'Descarga de cinzas',t:'Cinza separada caindo nas tremonhas / bica.',s:'M-075 / R-111'}
};

/* ---------------- trajetos ---------------- */
var paths=[];
function L(T,pts){return pts.map(function(p){return [T,p[0],p[1]]})}
function cat(){var r=[];for(var i=0;i<arguments.length;i++)r=r.concat(arguments[i]);return r}
function mk(layer,pts,o){o=o||{};paths.push({layer:layer,raw:pts,o:o});}

/* evaporador */

[-4.5,-1.5,1.5,4.5].forEach(function(T){mk('evap',L(T,[[0.06,17.03],[0.92,17.5],[0.92,18.6],[0,21.46],[0,49.6],[-0.3,50.9],[-1.25,51.75]]),{tube:0.14,v:3.2,dens:1.6,bub:1,bs:0.14,in1:'#d6efff',ipa:0.14,ipb:0.95,info:'frente'})});
[-3,3].forEach(function(T){mk('evap',L(T,[[0.06,17.03],[0.9,16.95],[6.5,16.9],[6.73,17.6],[6.73,38.4],[7.2,38.6],[7.75,38.6],[7.75,50.64],[7.75,51.5],[-0.6,51.5],[-1.2,51.72]]),{tube:0.14,v:3.2,dens:1.4,bub:1,bs:0.22,in1:'#d6efff',ipa:0.22,ipb:0.92,assumed:1,info:'tras'})});
[-6.45,6.45].forEach(function(T){mk('evap',[[T,3.4,17.0],[T,3.4,49.75],[T,3.4,50.48],[T*0.98,-0.8,51.6],[T*0.95,-1.5,51.95]],{tube:0.14,v:3.2,dens:1.2,bub:1,bs:0.1,in1:'#d6efff',ipa:0.1,ipb:0.9,info:'lat'})});
[0,-2.346,2.346,-4.488,4.488].forEach(function(T){mk('evap',L(T,[[3.7,16.4],[3.7,49.6],[3.2,50.3],[0.2,51.1],[-1.0,51.7]]),{tube:0.13,v:3.2,dens:1.1,bub:1,bs:0.1,in1:'#d6efff',ipa:0.1,ipb:0.9,assumed:1,info:'div'})});

mk('agua',[[17.8,26.62,27.25],[17.8,26.62,13.3]],{tube:0.22,v:3.4,dens:0.6,assumed:1,info:'aguaA'});

var econ=[];ZIG.forEach(function(s){econ.push(s[0],s[1])});
var DIS=[[17.2,26.62,12.75],[9.5,26.62,12.75],[9.5,20.95,12.75],[9.5,20.95,22.16],[7.2,20.95,22.16]];

});
mk('agua',[[7.2,20.95,22.16],[-6.9,20.95,22.16]],{tube:0.2,v:1,dens:0,info:'eco'});

mk('agua',[[7.6,5.6,56.5],[0.25,5.6,56.5],[0.25,5.6,54.85]],{tube:0.1,v:1.8,dens:2.5,assumed:1,info:'spray'});

mk('vapor',L(0,[[-1.4,53.52],[-1.4,53.9],[13.69,53.9],[13.69,51.25]]),{tube:0.2,v:5,dens:0.6,assumed:1,in0:'#eaf4ff',in1:'#ffc0cc',info:'sat'});

[21.16,22.24,23.34].forEach(function(d){mk('cond',[[17.8,d,32.6],[17.8,d,31.1],[17.8,d,29.7]],{v:2.4,dens:4,kind:'dot',sz:0.1,col:'#bfe6ff',info:'dea'})});

/* purga */
mk('purga',[[-6,-2.7,51.95],[-6,-3.4,51.25],[-8.6,-3.4,51.25],[-8.6,-10.5,51.25],[-8.6,-10.5,22.4]],{tube:0.12,v:3,dens:0.5,assumed:1,info:'purga'});

/* ar primário: duto (ilustrativo) e subida pelos caps */

  glass(new THREE.BoxGeometry(0.9,0.9,1.6),V(17.8,25.3,12.75),null,0x3b8cff,'bomba');
  /* atemperador (posição assumida na linha) */
  glass(new THREE.CylinderGeometry(0.32,0.32,1.4,16,1),V(0,5.6,54.57),[Math.PI/2,0,0],0xff5c7a,'atem');
}
var lvT=0;
function stepWater(dt){lvT+=dt;WL.forEach(function(w,i){w.p.constant=w.y+Math.sin(lvT*1.6+i)*0.025})}

/* ---------------- raio-x e modelo leve ---------------- */
var XM=null,LITE=null;
function xray(onX){
  if(onX&&!XM){XM=[];var seen=[];scene.traverse(function(n){if(n.userData.fx||!n.material)return;var p=n.parent;while(p){if(p.userData&&p.userData.fx)return;p=p.parent}
    (Array.isArray(n.material)?n.material:[n.material]).forEach(function(m){if(seen.indexOf(m)>=0)return;seen.push(m);XM.push([m,m.transparent,m.opacity,m.depthWrite]);m.transparent=true;m.opacity=Math.min(m.opacity,n.isLine||n.isLineSegments?0.25:0.14);m.depthWrite=false;m.needsUpdate=true})})}
  else if(!onX&&XM){XM.forEach(function(x){x[0].transparent=x[1];x[0].opacity=x[2];x[0].depthWrite=x[3];x[0].needsUpdate=true});XM=null}
  fx.mark()}
function lite(onL){var G=fx.G||{};
  if(onL&&!LITE){LITE=[];['gSS','gSP','gECO'].forEach(function(k){var g=G[k];if(!g)return;g.traverse(function(n){if((n.isMesh||n.isInstancedMesh)&&n.visible){n.visible=false;LITE.push(n)}})})}
  else if(!onL&&LITE){LITE.forEach(function(n){n.visible=true});LITE=null}
  fx.mark()}

/* ---------------- interface ---------------- */
var S={open:false,built:false,play:true,speed:1,xr:true,lite:false};
var coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;S.lite=!!coarse;
var seg=document.querySelector('.toolbar .seg');
var bF=document.createElement('button');bF.id='bFlux';bF.type='button';bF.title='Mostrar os fluxos de água, vapor, ar, gases e sólidos dentro do 3D';
bF.innerHTML='<svg class="i" viewBox="0 0 24 24"><path d="M3 8c3-3 6 3 9 0s6-3 9 0M3 14c3-3 6 3 9 0s6-3 9 0M3 20c3-3 6 3 9 0s6-3 9 0"/></svg>Fluxos';
if(seg){var ref=document.getElementById('bFilt');seg.insertBefore(bF,ref||null)}
var pnl=document.createElement('div');pnl.id='fxp';pnl.hidden=true;
pnl.innerHTML='<div class="fxh"><b id="fxT" title="Mostrar/recolher as camadas" tabindex="0">Fluxos da caldeira</b><button type="button" id="fxPlay">⏸ Pausar</button><button type="button" id="fxX" aria-label="Fechar fluxos">✕</button></div>'+
 '<div class="fxrow" id="fxPre"><button type="button" data-p="all" class="on">Tudo</button><button type="button" data-p="wv">Água e vapor</button><button type="button" data-p="ag">Ar e gases</button><button type="button" data-p="bed">Leito, sólidos e cinzas</button></div>'+
 '<div class="fxrow" id="fxChips"></div>'+
 '<div class="fxopt"><label><input type="checkbox" id="fxXr" checked> Raio‑X</label><label title="Esconde as serpentinas dos superaquecedores e do economizador (24 milhões de triângulos) enquanto os fluxos estão abertos"><input type="checkbox" id="fxLite"> Modelo leve</label><label>Velocidade <input type="range" id="fxSpd" min="0.2" max="3" step="0.1" value="1"></label></div>'+
 '<div class="fxleg">Dentro dos tubos: <b style="color:#3b8cff">água</b> · <b style="color:#7fd0ff">mistura com bolhas</b> · <b style="color:#ff5c7a">vapor</b>. <span class="as"></span>tubo com anéis laranja ou linha tracejada = trajeto assumido. Toque/clique num tubo ou vaso para ver o que é.</div>';
wrap.appendChild(pnl);
if(coarse||(window.matchMedia&&matchMedia('(max-width:820px)').matches))pnl.classList.add('min');
var fxT=pnl.querySelector('#fxT');fxT.onclick=function(){pnl.classList.toggle('min')};fxT.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pnl.classList.toggle('min')}};
var inf=document.createElement('div');inf.id='fxInfo';inf.innerHTML='<button class="x" type="button" aria-label="Fechar">×</button><div></div>';wrap.appendChild(inf);
inf.querySelector('.x').onclick=function(){inf.classList.remove('show')};
var chips=pnl.querySelector('#fxChips');
Object.keys(LAY).forEach(function(k){var l=document.createElement('span');l.className='fxc';l.dataset.k=k;l.setAttribute('role','checkbox');l.setAttribute('aria-checked','true');l.tabIndex=0;l.innerHTML='<i style="background:'+LAY[k].c+'"></i>'+LAY[k].n;
  function tog(){on[k]=!on[k];sync();[].forEach.call(pnl.querySelectorAll('#fxPre button'),function(b){b.classList.remove('on')})}
  l.onclick=tog;l.onkeydown=function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();tog()}};chips.appendChild(l)});
function sync(){[].forEach.call(chips.children,function(l){var k=l.dataset.k;l.classList.toggle('off',!on[k]);l.setAttribute('aria-checked',on[k]?'true':'false');LG[k].visible=on[k]});fx.mark()}
[].forEach.call(pnl.querySelectorAll('#fxPre button'),function(b){b.onclick=function(){var list=PRE[b.dataset.p];Object.keys(on).forEach(function(k){on[k]=list.indexOf(k)>=0});
  [].forEach.call(pnl.querySelectorAll('#fxPre button'),function(x){x.classList.toggle('on',x===b)});sync()}});
var bPlay=pnl.querySelector('#fxPlay');
bPlay.onclick=function(){S.play=!S.play;bPlay.textContent=S.play?'⏸ Pausar':'▶ Reproduzir'};
pnl.querySelector('#fxSpd').oninput=function(){S.speed=+this.value};
var cXr=pnl.querySelector('#fxXr'),cLi=pnl.querySelector('#fxLite');cLi.checked=S.lite;
cXr.onchange=function(){S.xr=cXr.checked;xray(S.open&&S.xr)};
cLi.onchange=function(){S.lite=cLi.checked;lite(S.open&&S.lite)};
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){S.play=false;bPlay.textContent='▶ Reproduzir'}
function setOpen(v){S.open=v;bF.classList.toggle('on',v);bF.setAttribute('aria-pressed',v?'true':'false');pnl.hidden=!v;
  if(v&&!S.built){build();S.built=true;sync()}
  ROOT.visible=v;cLi.checked=S.lite;cXr.checked=S.xr;xray(v&&S.xr);lite(v&&S.lite);if(!v)inf.classList.remove('show');
  if(v){stepParts(0,0);document.body.classList.remove('fopen')}fx.mark()}
bF.onclick=function(){setOpen(!S.open)};
pnl.querySelector('#fxX').onclick=function(){setOpen(false)};
['pointerdown','wheel'].forEach(function(ev){pnl.addEventListener(ev,function(e){e.stopPropagation()},{passive:true})});

/* clique num tubo ou vaso */
var el=renderer.domElement,dn=null,ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
el.addEventListener('pointerdown',function(e){dn={x:e.clientX,y:e.clientY}});
el.addEventListener('pointerup',function(e){if(!S.open||!dn)return;var mv=Math.abs(e.clientX-dn.x)+Math.abs(e.clientY-dn.y);dn=null;if(mv>6)return;
  var rc=el.getBoundingClientRect();ndc.set(((e.clientX-rc.left)/rc.width)*2-1,-((e.clientY-rc.top)/rc.height)*2+1);ray.setFromCamera(ndc,cam);
  var vis=PICK.filter(function(m){var p=m;while(p){if(!p.visible)return false;p=p.parent}return true});
  var h=ray.intersectObjects(vis,false);if(!h.length)return;var it=INFO[h[0].object.userData.info];if(!it)return;
  inf.querySelector('div').innerHTML='<b>'+it.n+'</b>'+it.t+(it.p?'<span class="pm">Premissa: '+it.p+'</span>':'')+'<span class="src">Fonte: '+it.s+'</span>';inf.classList.add('show')});

/* ---------------- laço (chamado pelo laço de desenho do 3D) ---------------- */
var last=0,acc=0,clock=0;
window.__fxTick=function(now){
  if(!S.open||!S.built){last=now;return}
  var dt=last?Math.min(0.1,(now-last)/1000):0;last=now;acc+=dt;
  var h=renderer.domElement.height;UNI.scale.value=h/(2*Math.tan(cam.fov*Math.PI/360));
  if(!S.play){acc=0;return}
  if(acc<1/30)return;
  var st=acc*S.speed;acc=0;clock+=st;
  stepParts(st,clock);stepWater(st);SCROLL.forEach(function(s){s.t.offset.x-=st*s.k});fx.mark();
};
document.addEventListener('visibilitychange',function(){last=0});
window.__fluxos3d={open:setOpen,S:S,paths:paths};
})();
